# dualshock2xbox settings ; edit and save, no need to touch the command line.
# lines starting with # or ; are comments.

# how often we read the pad, per second (250 is what a real Xbox pad uses)
hz=250

# stick deadzone 0..1 ; raise it if your character drifts on its own
deadzone=0.08

# gyro aiming: 1 = the gyro steers the right stick, 0 = off
gyro=0

# how hard the gyro pushes the stick, 0..1
gyro_gain=0.6

# light bar color at startup, as r,g,b (0-255 each) ; comment out to leave it alone
#lightbar=0,80,255

# DualSense player LED (1-5), 0 = off ; DualShock 4 has no such lights
player_led=0

# DualSense adaptive triggers (DualShock 4 has none), applied at startup:
# trigger_mode: 0 = off, 1 = steady resistance, 2 = weapon click, 3 = vibration
trigger_mode=0
trigger_start=2      # zone 0-9 where the effect begins
trigger_strength=6   # 1-8
trigger_freq=40      # vibration frequency in Hz (mode 3 only)

# button remapping: remap_<playstation button>=<xbox button>
# playstation buttons: square cross circle triangle l1 r1 l2 r2 create options
#                      l3 r3 ps touchpad   (l2/r2 are analog, cannot be remapped)
# xbox buttons:        a b x y lb rb ls rs back start guide dpad_up dpad_down
#                      dpad_left dpad_right
# examples:
#remap_cross=b        # swap the japanese layout (cross becomes B)
#remap_touchpad=rs    # touchpad click acts as right stick click

# safe_mode=1 makes the tool read-only: it translates input but never sends
# rumble/LED/trigger reports to your controller. good for peace of mind.
#safe_mode=0

# stick shaping ported from DS4Windows (GPL-3.0, see NOTICE.txt):
# anti_deadzone lifts the output floor so tiny stick movements clear the
# game's own deadzone ; max_zone lets a worn stick still reach full deflection
anti_deadzone=0.0
max_zone=1.0
